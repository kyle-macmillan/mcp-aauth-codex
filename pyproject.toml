[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-aauth-codex"
version = "0.1.0"
description = "Codex stdio proxy for AAuth-protected eDocs MCP servers"
requires-python = ">=3.10"
dependencies = [
    "aauth-edocs[flask]",
    "duckdb>=1.4",
    "httpx2>=2.5.0",
    "mcp",
    "mcp-aauth",
    "pydantic>=2",
    "requests>=2",
]

[project.scripts]
mcp-aauth-codex = "mcp_aauth_codex.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_aauth_codex"]

[tool.uv.sources]
aauth-edocs = { path = "../aauth", editable = true }
mcp-aauth = { path = "../mcp-aauth", editable = true }
mcp = { path = "../python-sdk", editable = true }
mcp-types = { path = "../python-sdk/src/mcp-types", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
